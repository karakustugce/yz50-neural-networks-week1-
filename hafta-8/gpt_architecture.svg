<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><rect width="1100" height="610" fill="#f7f9fc"/><text x="550" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#172b4d">Hafta 8 — Character GPT mimarisi ve aşamalı kurulum</text><text x="550" y="72" text-anchor="middle" font-family="Arial" font-size="14" fill="#52627a">Bu görsel mimari şemadır; repoda henüz Hafta 8 eğitim sonuçları kaydedilmemiştir.</text>
<g font-family="Arial" text-anchor="middle"><rect x="90" y="125" width="170" height="68" rx="12" fill="#dcebf0" stroke="#397f92" stroke-width="2"/><text x="175" y="155" font-size="16" font-weight="700" fill="#172b4d">Karakter</text><text x="175" y="178" font-size="13" fill="#52627a">token ID</text>
<rect x="310" y="125" width="170" height="68" rx="12" fill="#dcebf0" stroke="#397f92" stroke-width="2"/><text x="395" y="155" font-size="16" font-weight="700" fill="#172b4d">Token + pozisyon</text><text x="395" y="178" font-size="13" fill="#52627a">embedding</text>
<rect x="530" y="125" width="230" height="68" rx="12" fill="#e8e2f3" stroke="#7862a6" stroke-width="2"/><text x="645" y="155" font-size="16" font-weight="700" fill="#172b4d">Transformer bloğu</text><text x="645" y="178" font-size="13" fill="#52627a">multi-head attention</text>
<rect x="530" y="245" width="230" height="68" rx="12" fill="#e8e2f3" stroke="#7862a6" stroke-width="2"/><text x="645" y="275" font-size="16" font-weight="700" fill="#172b4d">Feed-forward MLP</text><text x="645" y="298" font-size="13" fill="#52627a">token başına dönüşüm</text>
<rect x="530" y="365" width="230" height="68" rx="12" fill="#e9f2e8" stroke="#72a78e" stroke-width="2"/><text x="645" y="395" font-size="16" font-weight="700" fill="#172b4d">Çıktı katmanı</text><text x="645" y="418" font-size="13" fill="#52627a">sonraki karakter logits</text>
<rect x="850" y="145" width="170" height="90" rx="12" fill="#fff0e8" stroke="#cf7548" stroke-width="2"/><text x="935" y="178" font-size="16" font-weight="700" fill="#172b4d">Causal maske</text><text x="935" y="202" font-size="13" fill="#52627a">geleceği kapatır</text></g>
<g stroke="#64748b" stroke-width="2.5" fill="none"><path d="M260 159H305"/><path d="M480 159H525"/><path d="M645 195V240"/><path d="M645 315V360"/><path d="M760 159H845"/><path d="M935 240V475H760"/></g><g fill="#64748b"><path d="M305 159l-9 -5v10z"/><path d="M525 159l-9 -5v10z"/><path d="M645 240l-5 -9h10z"/><path d="M645 360l-5 -9h10z"/></g>
<text x="550" y="470" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#172b4d">Eğitimde karşılaştırılacak aşamalar</text>
<g font-family="Arial" font-size="13" text-anchor="middle" fill="#34465e"><rect x="70" y="495" width="120" height="42" rx="8" fill="#e7edf4"/><text x="130" y="521">Bigram</text><rect x="210" y="495" width="120" height="42" rx="8" fill="#e7edf4"/><text x="270" y="521">Tek head</text><rect x="350" y="495" width="120" height="42" rx="8" fill="#e7edf4"/><text x="410" y="521">Multi-head</text><rect x="490" y="495" width="120" height="42" rx="8" fill="#e7edf4"/><text x="550" y="521">Feed-forward</text><rect x="630" y="495" width="120" height="42" rx="8" fill="#e7edf4"/><text x="690" y="521">Residual</text><rect x="770" y="495" width="120" height="42" rx="8" fill="#e7edf4"/><text x="830" y="521">LayerNorm</text><rect x="910" y="495" width="120" height="42" rx="8" fill="#dcebf0"/><text x="970" y="521">GPT</text></g><text x="550" y="580" text-anchor="middle" font-family="Arial" font-size="12" fill="#65758b">Residual bağlantılar ve LayerNorm her Transformer bloğunun içindeki yolları destekler; şema kavramsaldır.</text></svg>